[project]
name = "verys"
version = "0.1.0"
description = "Verys identity / OAuth2 service"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.41",
    "sqlmodel>=0.0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.15",
    "psycopg2>=2.9",
    "pyjwt>=2.11",
    "cryptography>=46.0",
    "bcrypt>=4.3",
    "python-dotenv>=1.2",
    "aiosmtplib>=5.1",
    "jinja2>=3.1",
    "email-validator>=2.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0",
    "sentry-sdk>=2.53",
    "httpx>=0.28",
    "humanize>=4.15",
    "pymongo>=4.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verys"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
